name: InstaTrueReel Diagnostic Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download apktool 3.0.3
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Download uber-apk-signer
        run: |
          curl -sL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: "Decode APK with apktool (smali only, -r preserves resource IDs)"
        run: |
          APK="Instagram-v435.0.0.37.76-patches-v3.8.0.apk"
          echo "Decoding $APK with -r (no resource decode — preserves R.id values)..."
          java -Xmx4g -jar apktool.jar d -r -f -o decoded "$APK" 2>&1 | tail -5
          echo "=== total smali files ==="
          find decoded -name "*.smali" | wc -l
          echo "=== resources.arsc preserved ==="
          ls decoded/resources.arsc && echo "resources.arsc present (original, IDs preserved)" || echo "WARNING: no resources.arsc"

      - name: Apply InstaTrueReel DIAGNOSTIC patches
        run: |
          python3 InstaTrueReel/patches/apply_diagnostic.py decoded

      - name: Build patched APK
        run: |
          echo "Building patched APK ..."
          java -Xmx4g -jar apktool.jar b decoded -o patched-unsigned.apk 2>&1 | tail -10
          ls -lh patched-unsigned.apk

      - name: Zipalign + Sign
        run: |
          # uber-apk-signer handles zipalign + sign in one step (uses a debug key)
          java -jar uber-apk-signer.jar -a patched-unsigned.apk --out signed/
          ls -lh signed/
          mv signed/patched-unsigned-aligned-debugSigned.apk InstaTrueReel-diagnostic.apk || \
          mv signed/*.apk InstaTrueReel-diagnostic.apk
          ls -lh InstaTrueReel-diagnostic.apk

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTrueReel-diagnostic-apk
          path: InstaTrueReel-diagnostic.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## InstaTrueReel DIAGNOSTIC Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Patched APK:** InstaTrueReel-diagnostic-apk artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### THIS IS A DIAGNOSTIC BUILD — status bar will show a solid color." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install, open Reels, screenshot a reel, and look at the **status-bar region** (the strip where time/battery show):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Color seen in status-bar strip | Meaning | Next step |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **RED** | A1/A2 applied + video does NOT reach the bar | Fix: hunt & zero the inset/padding pushing the video down (A3/6BM is insufficient) |" >> $GITHUB_STEP_SUMMARY
          echo "| **DARK (not red)** | A1/A2 patch patterns failed to match | Fix: re-check smali patterns |" >> $GITHUB_STEP_SUMMARY
          echo "| **BLACK (pure)** | video reaches but letterboxes, or a black overlay view | Fix: force-fill crop (setForceFillTextureScaling) or hunt overlay |" >> $GITHUB_STEP_SUMMARY
          echo "| **video shows** | DONE | Switch window bg back to null and ship |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Patches applied (status-bar diagnostic):" >> $GITHUB_STEP_SUMMARY
          echo "- **A-DIAG:** window bg = RED ColorDrawable, statusbar transparent, FLAG_LAYOUT_NO_LIMITS (at 2ZS.A01 start)" >> $GITHUB_STEP_SUMMARY
          echo "- **A1:** decorView 0cW.A0R -> transparent (intercept 2ZS.A01 :202)" >> $GITHUB_STEP_SUMMARY
          echo "- **A2:** content 0cW.A0R -> transparent (intercept 2ZS.A05 :410)" >> $GITHUB_STEP_SUMMARY
          echo "- **A3:** zero top inset (6BM.Fji)" >> $GITHUB_STEP_SUMMARY
          echo "- **A5:** 1fC.A04 -> transparent status bar (incl. deferred Choreographer path)" >> $GITHUB_STEP_SUMMARY
          echo "- **A7:** 2ZS.A00 -> transparent 47l swipe_nav" >> $GITHUB_STEP_SUMMARY
          echo "- **B1+B2:** (working) transparent main bottom nav" >> $GITHUB_STEP_SUMMARY
          echo "- **SKIPPED:** C (comment sheet), D (fullscreen), CS1 (comment bar) — focused diagnostic" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install note:" >> $GITHUB_STEP_SUMMARY
          echo "Uninstall the current Instagram first (signature changed). Then install the diagnostic APK." >> $GITHUB_STEP_SUMMARY
