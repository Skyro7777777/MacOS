name: InstaPatchedTrueReel

on:
  push:
    paths:
      - 'InstaPatchedTrueReel/**'
      - '.github/workflows/insta-patched-true-reel.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Download apktool + uber-apk-signer
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -sL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar apktool.jar --version

      - name: Compile TrueReelsHelper (fullscreen button)
        id: helper
        continue-on-error: true
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          export D8="$ANDROID_SDK_ROOT/build-tools/34.0.0/d8"
          echo "ANDROID_JAR=$ANDROID_JAR" >> $GITHUB_ENV
          mkdir -p helper_classes helper_dex
          javac -source 17 -target 17 -classpath "$ANDROID_JAR" \
            -d helper_classes InstaPatchedTrueReel/TrueReelsHelper.java
          "$D8" --release --output helper_dex --lib "$ANDROID_JAR" \
            helper_classes/app/truereels/TrueReelsHelper.class
          mv helper_dex/classes.dex helper_dex/helper.dex
          ls -lh helper_dex/helper.dex

      - name: Run patcher
        run: |
          APK="Instagram-v435.0.0.37.76-patches-v3.8.0.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found in repo root"; exit 1
          fi
          if [ "${{ steps.helper.outcome }}" = "success" ] && [ -f helper_dex/helper.dex ]; then
            python3 InstaPatchedTrueReel/patch.py \
              --apk "$APK" --out out \
              --helper-dex helper_dex/helper.dex \
              --apktool apktool.jar --signer uber-apk-signer.jar
          else
            echo "::warning::Helper build failed; producing core-only APK (no fullscreen button)"
            python3 InstaPatchedTrueReel/patch.py \
              --apk "$APK" --out out --no-helper \
              --apktool apktool.jar --signer uber-apk-signer.jar
          fi

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-true916-patched
          path: out/Instagram-true916-patched.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload patcher log / work dir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patcher-workdir
          path: out/
          retention-days: 7
