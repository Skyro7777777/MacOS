name: JadxDecompile

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Show runner specs
        run: |
          echo "========== RUNNER SPECS =========="
          echo "CPU cores : $(nproc)"
          echo "Memory    : $(free -h | awk '/Mem:/ {print $2}')"
          echo "Disk      : $(df -h / | awk 'NR==2 {print $2}')"
          echo "Hostname  : $(hostname)"
          echo "=================================="

      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download jadx
        run: |
          curl -sL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile with jadx (readable Java source)
        env:
          JAVA_OPTS: "-Xmx12g -XX:+UseG1GC"
        run: |
          mkdir -p jadx-out
          APK="Instagram-v435.0.0.37.76-patches-v3.8.0.apk"
          ./jadx/bin/jadx \
            -d jadx-out \
            --no-res \
            --threads-count 6 \
            --show-bad-code \
            --log-level INFO \
            "$APK" 2>&1 | tee jadx.log | tail -50
          echo "=== java file count ==="
          find jadx-out -name "*.java" | wc -l

      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: instagram-decompiled-java
          path: jadx-out/
          retention-days: 14
          if-no-files-found: error
