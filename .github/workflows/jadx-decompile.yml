name: JadxDecompile

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download jadx
        run: |
          curl -sL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx.zip -d jadx

      - name: Decompile with jadx (readable Java source)
        run: |
          mkdir -p jadx-out
          APK="Instagram-v435.0.0.37.76-patches-v3.8.0.apk"
          java -Djava.awt.headless=true -Xmx6g -jar jadx/lib/jadx-1.5.0-all.jar \
            -d jadx-out \
            --no-res \
            --threads-count 4 \
            --log-level INFO \
            "$APK" 2>&1 | tail -30
          echo "=== java file count ==="
          find jadx-out -name "*.java" | wc -l

      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: instagram-decompiled-java
          path: jadx-out/
          retention-days: 14
          if-no-files-found: error
