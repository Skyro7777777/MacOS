name: InstaTrueReel Diagnostic v2 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download apktool 3.0.3
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Download uber-apk-signer
        run: |
          curl -sL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: "Decode APK with apktool (smali only, -r preserves resource IDs)"
        run: |
          APK="Instagram-v435.0.0.37.76-patches-v3.8.0.apk"
          echo "Decoding $APK with -r (no resource decode — preserves R.id values)..."
          java -Xmx4g -jar apktool.jar d -r -f -o decoded "$APK" 2>&1 | tail -5
          echo "=== total smali files ==="
          find decoded -name "*.smali" | wc -l
          echo "=== resources.arsc preserved ==="
          ls decoded/resources.arsc && echo "resources.arsc present (original, IDs preserved)" || echo "WARNING: no resources.arsc"

      - name: Apply InstaTrueReel DIAGNOSTIC v2 patches
        run: |
          python3 InstaTrueReel/patches/apply_diagnostic_v2.py decoded

      - name: Build patched APK
        run: |
          echo "Building patched APK ..."
          java -Xmx4g -jar apktool.jar b decoded -o patched-unsigned.apk 2>&1 | tail -10
          ls -lh patched-unsigned.apk

      - name: Zipalign + Sign
        run: |
          java -jar uber-apk-signer.jar -a patched-unsigned.apk --out signed/
          ls -lh signed/
          mv signed/patched-unsigned-aligned-debugSigned.apk InstaTrueReel-diagnostic-v2.apk 2>/dev/null || \
          mv signed/patched-aligned-debugSigned.apk InstaTrueReel-diagnostic-v2.apk 2>/dev/null || \
          mv signed/*.apk InstaTrueReel-diagnostic-v2.apk
          ls -lh InstaTrueReel-diagnostic-v2.apk

      - name: Upload diagnostic v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTrueReel-diagnostic-v2-apk
          path: InstaTrueReel-diagnostic-v2.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## InstaTrueReel DIAGNOSTIC v2 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Patched APK:** InstaTrueReel-diagnostic-v2-apk artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### v1 → v2 CORRECTION" >> $GITHUB_STEP_SUMMARY
          echo "v1 put the RED window-bg block in \`2ZS.A01\` (Reels-only — never called by MainActivity at startup)." >> $GITHUB_STEP_SUMMARY
          echo "v2 moves it to \`1fC.A04\` (called on EVERY screen via \`MainActivity.A1z → 1fC.A03 → 1fC.A04\`)." >> $GITHUB_STEP_SUMMARY
          echo "This was confirmed by reading the real jadx Java (156k files)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install + test (ANY screen — home feed OR Reels):" >> $GITHUB_STEP_SUMMARY
          echo "| Status-bar strip color | Meaning | Next step |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **RED** | 1fC.A04 runs + window bg is the layer showing through transparent status bar | Fix = null window bg + FLAG_LAYOUT_NO_LIMITS (content fills status bar region) |" >> $GITHUB_STEP_SUMMARY
          echo "| **BLACK** | 1fC.A04 not called, OR FLAG_FULLSCREEN from 1fC.A05(false) hides the bar | Deeper investigation needed |" >> $GITHUB_STEP_SUMMARY
          echo "| **video shows** | DONE | Switch RED→null, add CS2 comment-bar fix, ship |" >> $GITHUB_STEP_SUMMARY
