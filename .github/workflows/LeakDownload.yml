name: Fast Multi-Part File Download

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Full direct download URL"
        required: true
        type: string

      save_as:
        description: "Save as this filename (empty = use server/URL filename)"
        required: false
        type: string
        default: ""

      connections:
        description: "Parallel connections (4-16 recommended)"
        required: false
        type: string
        default: "16"

      user_agent:
        description: "Custom User-Agent (leave empty for default)"
        required: false
        type: string
        default: ""

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl

      - name: Detect server and download
        env:
          DOWNLOAD_URL: ${{ inputs.file_url }}
          SAVE_AS: ${{ inputs.save_as }}
          CONNECTIONS: ${{ inputs.connections }}
          USER_AGENT: ${{ inputs.user_agent }}
        shell: bash
        run: |
          set -Eeuo pipefail

          URL="$DOWNLOAD_URL"
          NAME="$SAVE_AS"
          CONN="$CONNECTIONS"
          UA="$USER_AGENT"

          # Sanitize connection count.
          if ! [[ "$CONN" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid connections value: $CONN"
            exit 1
          fi

          # Keep the number sensible for a GitHub runner.
          if [ "$CONN" -gt 16 ]; then
            CONN=16
          fi

          UA_ARGS=()
          if [ -n "$UA" ]; then
            UA_ARGS=(-A "$UA")
          fi

          echo "========================================"
          echo "URL: $URL"
          echo "Connections: $CONN"
          echo "========================================"

          # ------------------------------------------------------------
          # Get final HTTP headers.
          # ------------------------------------------------------------
          echo ""
          echo "[1/4] Checking server..."

          HEADER_FILE="$(mktemp)"

          if ! curl \
            -fsSLI \
            --max-redirs 10 \
            --connect-timeout 10 \
            --max-time 20 \
            "${UA_ARGS[@]}" \
            "$URL" > "$HEADER_FILE"; then

            echo "HEAD request failed."
            echo "Will fall back to a normal download."
            RANGE_SUPPORTED="false"
          else
            RANGE_SUPPORTED="false"

            if grep -Eiq '^accept-ranges:[[:space:]]*bytes' "$HEADER_FILE"; then
              RANGE_SUPPORTED="true"
            fi

            echo ""
            echo "Server headers:"
            grep -Ei '^(HTTP/|content-length:|content-disposition:|accept-ranges:|content-type:|location:)' "$HEADER_FILE" || true
          fi

          # ------------------------------------------------------------
          # Determine output filename.
          # ------------------------------------------------------------
          if [ -z "$NAME" ]; then
            NAME="$(basename "${URL%%\?*}")"

            if [ -z "$NAME" ] || [ "$NAME" = "/" ] || [ "$NAME" = "." ]; then
              NAME="download.bin"
            fi
          fi

          echo ""
          echo "Output filename: $NAME"

          # ------------------------------------------------------------
          # If the server advertises byte ranges, use aria2's
          # multi-connection range downloader.
          # ------------------------------------------------------------
          if [ "$RANGE_SUPPORTED" = "true" ]; then
            echo ""
            echo "[2/4] Server supports HTTP byte ranges."
            echo "Starting $CONN-way parallel download..."

            aria2c \
              --dir="$GITHUB_WORKSPACE" \
              --out="$NAME" \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              --file-allocation=none \
              --continue=true \
              --check-integrity=false \
              --max-connection-per-server="$CONN" \
              --split="$CONN" \
              --min-split-size=4M \
              --piece-length=4M \
              --stream-piece-selector=geom \
              --optimize-concurrent-downloads=true \
              --max-tries=8 \
              --retry-wait=2 \
              --timeout=30 \
              --connect-timeout=15 \
              --lowest-speed-limit=1K \
              --max-overall-download-limit=0 \
              --enable-http-keep-alive=true \
              --enable-http-pipelining=false \
              --http-accept-gzip=false \
              --summary-interval=2 \
              --console-log-level=notice \
              "${UA_ARGS[@]}" \
              "$URL"

          else
            # ----------------------------------------------------------
            # The server does NOT advertise byte ranges.
            #
            # Trying -x 16 anyway is pointless and can produce exactly
            # the "CN:16 DL:0B" behavior seen in the original workflow.
            # Use a normal fast single-connection download instead.
            # ----------------------------------------------------------
            echo ""
            echo "[2/4] Server does not advertise HTTP byte-range support."
            echo "Using a normal download instead of hanging on split requests."

            curl \
              -fL \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 3600 \
              --http1.1 \
              "${UA_ARGS[@]}" \
              -o "$NAME" \
              "$URL"
          fi

          # ------------------------------------------------------------
          # Verify that something was actually downloaded.
          # ------------------------------------------------------------
          echo ""
          echo "[3/4] Verifying download..."

          if [ ! -f "$NAME" ]; then
            echo "ERROR: Download file was not created."
            exit 1
          fi

          SIZE="$(stat -c '%s' "$NAME")"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Downloaded file is empty."
            exit 1
          fi

          echo "Downloaded: $NAME"
          echo "Size: $(numfmt --to=iec-i --suffix=B "$SIZE")"

          echo ""
          echo "[4/4] SHA-256:"
          sha256sum "$NAME"

      - name: Upload downloaded file
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ inputs.save_as != '' && inputs.save_as || '*' }}
          if-no-files-found: error
          retention-days: 5
