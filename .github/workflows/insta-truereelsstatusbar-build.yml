name: InstaTrueReelStatusBar Build

on:
  workflow_dispatch:
    inputs:
      features:
        description: 'Which features to include (all, a, b, c, d, cs)'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download apktool 3.0.3
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Download uber-apk-signer
        run: |
          curl -sL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: "Decode APK with apktool (smali only, -r keeps original resources)"
        run: |
          APK="Instagram-v435.0.0.37.76-patches-v3.8.0.apk"
          echo "Decoding $APK with -r (no resource decode)..."
          java -Xmx4g -jar apktool.jar d -r -f -o decoded "$APK" 2>&1 | tail -5
          echo "=== smali_classes dirs ==="
          ls decoded/ | grep smali | head -25
          echo "=== total smali files ==="
          find decoded -name "*.smali" | wc -l
          echo "=== resources kept as binary (no res/ recompilation) ==="
          ls decoded/resources.arsc 2>/dev/null && echo "resources.arsc present (original)" || echo "WARNING: no resources.arsc"

      - name: Apply InstaTrueReelStatusBar patches
        run: |
          python3 instatruereelsstatusbar/patches/apply_patches.py decoded

      - name: Build patched APK
        run: |
          echo "Building patched APK ..."
          java -Xmx4g -jar apktool.jar b decoded -o patched-unsigned.apk 2>&1 | tail -10
          ls -lh patched-unsigned.apk

      - name: Zipalign + Sign
        run: |
          # uber-apk-signer handles zipalign + sign in one step (uses a debug key)
          java -jar uber-apk-signer.jar -a patched-unsigned.apk --out signed/
          ls -lh signed/
          mv signed/patched-unsigned-aligned-debugSigned.apk InstaTrueReelStatusBar-patched.apk || \
          mv signed/*.apk InstaTrueReelStatusBar-patched.apk
          ls -lh InstaTrueReelStatusBar-patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTrueReelStatusBar-patched-apk
          path: InstaTrueReelStatusBar-patched.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## InstaTrueReelStatusBar Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Patched APK:** InstaTrueReelStatusBar-patched-apk artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features applied:" >> $GITHUB_STEP_SUMMARY
          echo "- **A:** Transparent status bar (video behind floating white icons)" >> $GITHUB_STEP_SUMMARY
          echo "- **B:** Floating bottom nav (transparent bg + zero gap)" >> $GITHUB_STEP_SUMMARY
          echo "- **C:** Translucent comment sheet (80% black, video visible behind)" >> $GITHUB_STEP_SUMMARY
          echo "- **CS (NEW):** Transparent navigation bar for bottom sheets (fixes comments bar black strip)" >> $GITHUB_STEP_SUMMARY
          echo "- **D:** TikTok-style fullscreen (rotate to landscape on fullscreen swipe)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install note:" >> $GITHUB_STEP_SUMMARY
          echo "Uninstall the current Instagram first (signature changed). Then install the patched APK." >> $GITHUB_STEP_SUMMARY
