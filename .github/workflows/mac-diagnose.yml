name: macOS Diagnose (Phase 0)

on:
  workflow_dispatch:
  push:
    paths:
      - 'apple-project/mac_diagnose.py'
      - '.github/workflows/mac-diagnose.yml'

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner basics
        run: |
          echo "=== whoami ==="
          whoami
          echo "=== sw_vers ==="
          sw_vers
          echo "=== csrutil status ==="
          csrutil status || true
          echo "=== arch ==="
          uname -m

      - name: Run diagnostic
        run: |
          python3 apple-project/mac_diagnose.py

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-diagnose
          path: /tmp/apple-diagnose/
          if-no-files-found: warn
          retention-days: 14
